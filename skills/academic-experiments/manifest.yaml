name: academic-experiments
description: >
  Declarative routing manifest for experiment evidence audit, inventory-only
  inspection, and minimal reproducible runs.

always_load:
  - static/core/stance.md
  - static/core/red-lines.md
  - static/core/output-contract.md
  - static/core/anti-patterns.md
  - ../shared/core/evidence-policy.md

axes:
  mode:
    detect: |
      Use explicit user mode first. Repo audit requests map to
      experiment-evidence-pass. "Only inspect" or "do not run" maps to
      evidence-inventory-only. A concrete command or checkpoint evaluation maps
      to minimal-reproducible-run.
    values:
      experiment-evidence-pass: references/run-strategy.md
      evidence-inventory-only: references/evidence-inventory.md
      minimal-reproducible-run: references/run-strategy.md
    multi: false

references:
  on_demand:
    - condition: evidence inventory and artifact discovery
      path: references/evidence-inventory.md
    - condition: runtime checks or minimal reproducible command planning
      path: references/run-strategy.md
    - condition: protocol risk assessment
      path: references/protocol-risks.md
    - condition: evidence inventory schema
      path: ../shared/schemas/evidence-inventory.md
