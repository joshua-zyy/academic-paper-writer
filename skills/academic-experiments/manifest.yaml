name: academic-experiments
description: Read-only evidence discovery with explicitly authorized execution.
always_load:
  - static/core/stance.md
  - static/core/red-lines.md
  - static/core/output-contract.md
  - static/core/anti-patterns.md
  - ../shared/core/evidence-policy.md
  - ../shared/core/output-boundaries.md
axes:
  mode:
    detect: |
      Default to evidence-inventory-only for paths or supplied results.
      Evidence passes remain read-only. Execution requires explicit scope.
    values:
      evidence-inventory-only: references/evidence-inventory.md
      experiment-evidence-pass: references/protocol-risks.md
      minimal-reproducible-run: references/run-strategy.md
    multi: false
references:
  on_demand:
    - condition: artifact inventory
      path: references/evidence-inventory.md
    - condition: authorized execution
      path: references/run-strategy.md
    - condition: protocol description and source conflicts
      path: references/protocol-risks.md
    - condition: evidence exchange
      path: ../shared/schemas/evidence-inventory.md
