name: academic-reviser
description: Artifact acceptance without manuscript rewriting or peer review.
always_load:
  - static/core/stance.md
  - static/core/red-lines.md
  - static/core/output-contract.md
  - static/core/anti-patterns.md
  - ../shared/core/evidence-policy.md
  - ../shared/core/non-invention-rules.md
  - ../shared/core/output-boundaries.md
axes:
  scope:
    detect: Use requested scope; local tasks do not require manuscript intake.
    values:
      section: references/verification-checklists.md
      manuscript: references/revision-checklist.md
      targeted: references/verification-checklists.md
      recheck: references/verification-status.md
    multi: false
references:
  on_demand:
    - condition: complete artifact acceptance checklist
      path: references/revision-checklist.md
    - condition: section-specific checks
      path: references/verification-checklists.md
    - condition: verdict or issue recheck
      path: references/verification-status.md
    - condition: output formatting
      path: references/templates/section-critique.md
    - condition: verification contract
      path: ../shared/schemas/verification-report.md
    - condition: common acceptance errors
      path: references/common-pitfalls.md
    - condition: output examples
      path: references/examples/reviser-output-examples.md
