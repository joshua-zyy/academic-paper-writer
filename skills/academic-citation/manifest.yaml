name: academic-citation
description: Citation identity, source reading and claim-support mapping.
always_load:
  - static/core/stance.md
  - static/core/red-lines.md
  - static/core/output-contract.md
  - static/core/anti-patterns.md
  - ../shared/core/non-invention-rules.md
  - ../shared/core/output-boundaries.md
axes:
  workflow:
    detect: |
      Use explicit scope. Local paths do not force PDF conversion.
      Metadata checks do not require full-text reading.
    values:
      full-citation-pass: references/workflow-citation-pass.md
      targeted-citation-search: references/search-strategy.md
      exemplar-set-only: references/search-strategy.md
      citation-verification: references/verification-protocol.md
      local-citation-pass: references/workflow-citation-pass.md
      citation-verification-with-reading: references/verification-protocol.md
    multi: false
references:
  on_demand:
    - condition: query design
      path: references/search-strategy.md
    - condition: metadata or claim-support verification
      path: references/verification-protocol.md
    - condition: citation mapping
      path: references/citation-mapping.md
    - condition: identity records
      path: ../shared/schemas/verified-references.md
    - condition: reading reports
      path: ../shared/schemas/literature-reading-report.md
    - condition: reading delegation
      path: agents/literature-reader-agent.md
    - condition: claim-support records
      path: ../shared/schemas/citation-to-claim-map.md
    - condition: full or local workflow
      path: references/workflow-citation-pass.md
