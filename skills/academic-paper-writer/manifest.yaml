name: academic-paper-writer
description: >
  Produce content drafts through controlled probes and artifact acceptance.
  Reuse evidence and route local tasks without full-paper preparation.
always_load:
  - static/core/stance.md
  - static/core/red-lines.md
  - static/core/output-contract.md
  - static/core/anti-patterns.md
  - static/core/workflow.md
  - static/core/orchestration.md
  - ../shared/core/evidence-policy.md
  - ../shared/core/non-invention-rules.md
  - ../shared/core/output-boundaries.md
axes:
  mode:
    detect: |
      Use explicit scope. Local tasks do not enter full-paper intake.
      Citation and experiment tasks pass through to their sub-skills.
    values:
      full-paper-planning: references/orchestration-workflow.md
      section-drafting: references/workflow-step-8-9.5.md
      section-revision: references/workflow-step-9.6-12.md
      related-work-or-citation-pass: references/workflow-step-0-7.md
      experiment-evidence-pass: references/workflow-step-0-7.md
    multi: false
  paper_type:
    detect: |
      Use author intent and materials. Missing experiments alone
      do not make a position paper.
    values:
      empirical: references/paper-types.md
      theory: references/paper-types.md
      survey: references/paper-types.md
      reproducibility: references/paper-types.md
      position: references/paper-types.md
    multi: false
  section:
    detect: Use canonical IDs; ablation is an optional results subsection.
    values:
      introduction: references/section-writing-contracts.md
      related_work: references/section-writing-contracts.md
      method: references/section-writing-contracts.md
      experimental_setup: references/section-writing-contracts.md
      results: references/section-writing-contracts.md
      discussion: references/section-writing-contracts.md
      conclusion: references/section-writing-contracts.md
      abstract: references/section-writing-contracts.md
    multi: true
  language:
    detect: Reuse the requested language; ask only if it affects the result.
    values:
      en: references/writing-guidelines.md
      zh: references/writing-guidelines.md
      zh-to-en: references/writing-guidelines.md
    multi: false
references:
  on_demand:
    - condition: full-paper workflow
      path: references/orchestration-workflow.md
    - condition: intake and initial probes
      path: references/workflow-step-0-7.md
    - condition: storyline and drafting
      path: references/workflow-step-8-9.5.md
    - condition: acceptance, integration, delivery or resume
      path: references/workflow-step-9.6-12.md
    - condition: section argument planning
      path: references/section-writing-contracts.md
    - condition: section order and structure
      path: references/paper-structure.md
    - condition: missing materials
      path: references/placeholder-guide.md
    - condition: figure planning and delegation
      path: references/figure-generation-guide.md
    - condition: repeated unresolved issues
      path: references/iteration-control.md
    - condition: multi-step task plan
      path: references/standard-todo-template.md
    - condition: prose sufficiency or compression
      path: references/content-density.md
    - condition: examples
      path: references/examples/example-usage.md
